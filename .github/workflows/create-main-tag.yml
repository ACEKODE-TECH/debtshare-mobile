name: Create Main Tag

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  create-tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version from PR title
        id: extract
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          VERSION=$(echo "$TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not extract a version (expected 'Release vX.Y.Z') from PR title: $TITLE"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure the tag doesn't already exist
        run: |
          if git rev-parse "${{ steps.extract.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.extract.outputs.version }} already exists. Aborting to avoid overwriting it."
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.extract.outputs.version }}" -m "Release ${{ steps.extract.outputs.version }}"
          git push origin "${{ steps.extract.outputs.version }}"

      - name: Determine previous tag
        id: previous_tag
        run: |
          PREVIOUS=$(git tag --list 'v*.*.*' --sort=-v:refname | sed -n '2p')
          echo "previous_tag=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Trigger release notes generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-notes.yml \
            --ref main \
            -f from_tag="${{ steps.previous_tag.outputs.previous_tag }}" \
            -f to_tag="${{ steps.extract.outputs.version }}" \
            -f project=Mobile