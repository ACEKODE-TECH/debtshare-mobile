name: Coverage

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_ANDROID }}" | base64 -d > androidApp/google-services.json

      - name: Build and Test
        run: ./gradlew testAndroid jacocoRootReport
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          SERVER_ENDPOINT: ${{ secrets.SERVER_ENDPOINT }}
          SERVER_API_KEY: ${{ secrets.SERVER_API_KEY }}

      - name: Upload Jacoco reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "**/build/reports/jacoco/**/*.xml"
          retention-days: 1

  codecov:
    name: Codecov
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Jacoco reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: .

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/build/reports/jacoco/**/*.xml"
          slug: ${{ github.repository }}
          codecov_yml_path: "config/codecov.yml"
          fail_ci_if_error: true
